<!DOCTYPE html>
<html>
<head>
    <title>Slider Iframe Test</title>
    <style>
        body { 
            font-family: system-ui; 
            padding: 20px; 
            background: #f5f5f5;
        }
        iframe { 
            border: 2px solid #333; 
            border-radius: 8px;
            background: white;
        }
        .console { 
            background: #1a1a1a; 
            color: #00ff00; 
            padding: 10px; 
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Slider Iframe Test</h1>
    <p>This simulates how the slider will be embedded in Hazel:</p>
    
    <iframe 
        src="http://localhost:5173/?min=0&max=100&initial=50&id=test-slider"
        width="400" 
        height="100">
    </iframe>
    
    <h3>Message Console:</h3>
    <div id="console" class="console">Waiting for messages...</div>
    
    <script>
        const consoleDiv = document.getElementById('console');
        
        function log(message) {
            consoleDiv.innerHTML += message + '<br>';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        // Listen for messages from the iframe
        window.addEventListener('message', (event) => {
            if (event.origin === 'http://localhost:5173') {
                log(`📥 Received: ${JSON.stringify(event.data)}`);
                
                // Send back an init message when we get ready
                if (event.data.type === 'ready') {
                    event.source.postMessage({
                        type: 'init',
                        id: event.data.id,
                        value: 75  // Set initial value to 75
                    }, event.origin);
                    log(`📤 Sent init with value 75`);
                }
            }
        });
        
        log('🔍 Listening for messages from iframe...');
    </script>
</body>
</html>
