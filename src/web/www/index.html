	<script>
		// The gaios-hosted automerge bundle (loaded via the importmap) fetches
		// its wasm at an origin-absolute path "/assets/automerge_wasm_bg-<hash>.wasm"
		// — a path that only exists on gaios.sgai.uk itself, and whose hash
		// rotates on every gaios rebuild. Redirect those fetches to gaios (served
		// with CORS), falling back to a local copy under assets/ if gaios fails.
		(() => {
			const GAIOS = "https://gaios.sgai.uk";
			const origFetch = window.fetch;
			window.fetch = function (input, init) {
				const url = typeof input === "string" ? input : input?.url;
				const m = url && url.match(/^(?:https?:\/\/[^/]+)?(\/assets\/automerge_wasm_bg-[^/?#]+\.wasm)$/);
				if (m && (!url.startsWith("http") || url.startsWith(location.origin))) {
					const local = new URL("." + m[1], document.baseURI);
					return origFetch.call(this, GAIOS + m[1], init)
						.then(r => (r.ok ? r : origFetch.call(this, local, init)))
						.catch(() => origFetch.call(this, local, init));
				}
				return origFetch.call(this, input, init);
			};
		})();
	</script>
