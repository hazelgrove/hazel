<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hazel Palette</title>
    <style>
      :root {
        --none: oklch(0% 0 0 / 0%);
        --black: oklch(0% 0 0);

        /* STONE */
        --ink: oklch(52% 0.03 220); /* code text */

        /* SAND */
        --code-background: oklch(99% 0.012 90); /* code background */

        /* CLAY */
        --surface-1: oklch(97% 0.025 90); /* buffer shards */
        --surface-2: oklch(from var(--surface-1) 94% c h); /* projector shards */
        --surface-3: oklch(from var(--surface-1) 91% c h); /* result background */
        --surface-4: oklch(from var(--surface-1) 88% c h); /* a darker background */

        /* ROCK */
        --frame-1: oklch(85% 0.07 90); /* caret shard, token buffer*/
        --frame-2: oklch(from var(--frame-1) 70% c h); /* exp shard arms */
        --frame-3: oklch(from var(--frame-1) 60% c h);
        --frame-4: oklch(from var(--frame-1) 50% c h);

        /* MOLTEN */
        --attention-1: oklch(95% 0.05 90); /* menu-bkg */
        --attention-2: oklch(91% 0.11 95); /* selections */
        --attention-3: oklch(88% 0.2 95); /* explicit hole */
        --attention-4: oklch(71% 0.2 95); /* backpack shards */

        /* MAGMA */
        --error-1: oklch(85% 0.1 30);
        --error-2: oklch(60% 0.3 30);
        --error-3: oklch(40% 0.3 30);

        /* MOSS */
        --success: oklch(70% 0.15 150);
        --success-soft: oklch(85% 0.15 150);
        --success-muted: oklch(80% 0.05 150);
        --info: oklch(70% 0.05 120);
        --info-strong: oklch(45% 0.05 120);

        /* GLASS */
        --pattern: oklch(60% 0.2 225);
        --type: oklch(60% 0.2 305);
        --type-pattern: oklch(60% 0.2 180);

        /* HIGHLIGHTS */
        --doc-1: oklch(0.95 0.07 360);
        --doc-2: oklch(from var(--doc-1) l c 240);
        --doc-3: oklch(from var(--doc-1) l c 120);

        /* MISC */
        --ERRHOLE: oklch(96% 0.02 47); /* temporary due to child arms */
        --CREASE: oklch(0% 0 0 / 40%);
        --SHADOW: oklch(50% 0.1 90 / 33%);
        --textarea-indicated: var(--code-background);
        --textarea-text: var(--frame-3);
        --textarea-v-stripe: oklch(78% 0.14 6 / 55%);
        --textarea-h-stripe: oklch(87% 0.07 246);
        --textarea-h-strip-selected: oklch(68% 0.14 76 / 30%);
      }

      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
      }

      .columns {
        display: flex;
        justify-content: space-between;
      }

      .column {
        width: 48%;
      }

      .color-group {
        margin-bottom: 30px;
        text-align: center;
      }

      h2 {
        margin-bottom: 10px;
      }

      .color-palette {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      .color-swatch {
        width: 80px;
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: black;
        font-weight: bold;
        font-size: 14px;
      }

      .color-swatch.dark {
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Hazel Palette</h1>

    <div class="columns">
      <div class="column">
        <div class="color-group">
          <h2>Base</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--none)">NONE</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--code-background)">SAND</div>
            &nbsp;&nbsp;
            <div class="color-swatch dark" style="background-color: var(--ink)">STONE</div>
            &nbsp;&nbsp;
            <div class="color-swatch dark" style="background-color: var(--black)">BLACK</div>
          </div>
        </div>

        <div class="color-group">
          <h2>Shale</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--frame-1)">BR1</div>
            <div class="color-swatch" style="background-color: var(--frame-2)">BR2</div>
            <div class="color-swatch dark" style="background-color: var(--frame-3)">BR3</div>
            <div class="color-swatch dark" style="background-color: var(--frame-4)">BR4</div>
          </div>
        </div>

        <div class="color-group">
          <h2>Clay</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--surface-1)">T1</div>
            <div class="color-swatch" style="background-color: var(--surface-2)">T2</div>
            <div class="color-swatch" style="background-color: var(--surface-3)">T3</div>
          </div>
        </div>

        
        <div class="color-group">
          <h2>Molten</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--attention-1)">Y0</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--attention-2)">Y1</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--attention-3)">Y2</div>
            <div class="color-swatch" style="background-color: var(--attention-4)">Y3</div>
          </div>
        </div>

        <div class="color-group">
          <h2>Glass</h2>
          <div class="color-palette">
            <div class="color-swatch dark" style="background-color: var(--pattern)">PAT</div>
            <div class="color-swatch dark" style="background-color: var(--type)">TYP</div>
            <div class="color-swatch dark" style="background-color: var(--type-pattern)">TPAT</div>
          </div>
        </div>

      </div>


      <div class="column">

        <div class="color-group">
          <h2>Magma</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--error-1)">R0</div>
            &nbsp;&nbsp;
            <div class="color-swatch dark" style="background-color: var(--error-2)">R1</div>
            <div class="color-swatch dark" style="background-color: var(--error-3)">R2</div>
          </div>
        </div>

        <div class="color-group">
          <h2>Moss</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--success)">G0</div>
            <div class="color-swatch" style="background-color: var(--success-soft)">G1</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--success-muted)">G2</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--info)">GB0</div>
            <div class="color-swatch dark" style="background-color: var(--info-strong)">GB1</div>
          </div>
        </div>

        <div class="color-group">
          <h2>Aura</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--doc-1)">HL-A</div>
            <div class="color-swatch" style="background-color: var(--doc-2)">HL-B</div>
            <div class="color-swatch" style="background-color: var(--doc-3)">HL-C</div>
          </div>
        </div>

        <div class="color-group">
          <h2>Free Parking</h2>
          <div class="color-palette">
            <div class="color-swatch" style="background-color: var(--SHADOW)">SHADOW</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--ERRHOLE)">ERRHOLE</div>
            &nbsp;&nbsp;
            <div class="color-swatch dark" style="background-color: var(--CREASE)">CREASE</div>
          </div>
          <div class="color-palette" style="padding-top: 9px;">
            <div class="color-swatch" style="background-color: var(--textarea-h-strip-selected)">TA0</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--textarea-v-stripe)">TA1</div>
            &nbsp;&nbsp;
            <div class="color-swatch" style="background-color: var(--textarea-h-stripe)">TA2</div>
            
            
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
