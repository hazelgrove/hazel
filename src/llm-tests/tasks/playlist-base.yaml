initialProgram: |
  # PLAYLIST MVU PRELUDE #

  # Non-negative ID for songs #
    type Id = Int in

  # Actions user can do in a playlist #
  type PlayListAction =
    + PlaySong(Id)
    + PauseCurrentSong
    + RemoveSong(Id)
    # Add to the front of the playList, ignore duplication #
    + AddSong(Id)
  in

  # The state of the playlist #
  type PlayListState =
    + Playing(Id)
    + PausedOn(Id)
    + NoSongSelected
  in

  # A playlist with a list of songs and the current state of the playlist #
    type PlayList = ([Id], PlayListState) in

  # Get all the song ids in the playlist #
    let get_songs: PlayList -> [Id] =
    fun playlist ->
    let songs, current = playlist in
    songs 
    in

    # Get the id of the currently playing song #
  let get_state: PlayList -> PlayListState =
    fun playlist ->
    let songs, state = playlist in
    state
  in

  # Update Playlist app model based on an action #

  let update: (PlayList, PlayListAction) -> PlayList =
    ?
  in

prompt: | 
  Write the Playlist update function
tests: |
  # Testing PlaySong #
  test update(([0, 1, 2], NoSongSelected), PlaySong(0)) == ([0, 1, 2], Playing(0)) end;
  test update(([0, 1, 2], PausedOn(1)), PlaySong(1)) == ([0, 1, 2], Playing(1)) end;
  test update(([0, 1, 2], PausedOn(0)), PlaySong(1)) == ([0, 1, 2], Playing(1)) end;

  # Testing PauseCurrentSong #
  test update(([0, 1, 2], NoSongSelected), PauseCurrentSong) == ([0, 1, 2], NoSongSelected) end;
  test update(([0, 1, 2], PausedOn(1)), PauseCurrentSong) == ([0, 1, 2], PausedOn(1)) end;
  test update(([0, 1, 2], Playing(0)), PauseCurrentSong) == ([0, 1, 2], PausedOn(0)) end;

  # Testing RemoveSong #
  test update(([0, 1, 2], NoSongSelected), RemoveSong(0)) == ([1, 2], NoSongSelected) end;
  test update(([0, 1, 2], Playing(0)), RemoveSong(0)) == ([1, 2], NoSongSelected) end;
  test update(([0, 1, 2], PausedOn(0)), RemoveSong(0)) == ([1, 2], NoSongSelected) end;
  test update(([0, 1, 2], Playing(1)), RemoveSong(0)) == ([1, 2], Playing(1)) end;
  test update(([0, 1, 2], PausedOn(1)), RemoveSong(0)) == ([1, 2], PausedOn(1)) end;
  test update(([0, 1, 2], Playing(1)), RemoveSong(3)) == ([0, 1, 2], Playing(1)) end;

  # Testing AddSong #
  test update(([0, 1, 2], NoSongSelected), AddSong(3)) == ([3, 0, 1, 2], NoSongSelected) end;
  test update(([0, 1, 2], Playing(0)), AddSong(3)) == ([3, 0, 1, 2], Playing(0)) end;
  test update(([0, 1, 2], PausedOn(0)), AddSong(3)) == ([3, 0, 1, 2], PausedOn(0)) end;



