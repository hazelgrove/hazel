initialProgram: |
  # EMOJIPAINT MVU #

  type Emoji = String in 
  type Canvas = [[Emoji]] in  
  type Row = Int in 
  type Col = Int in 

  type Model = (
    canvas = Canvas,    # The 2D grid of emojis #
    brush = Emoji,      # The currently selected emoji #
    palette = [Emoji]   # The list of available emojis #
  ) in

  type Action =
    + SetBrush(Int)         # Set the brush using a palette index #
    + PaintCell(Row, Col)   # Stamp the current emoji at the specified position #
    + ClearCell(Row, Col)   # Clear the emoji at the specified position #
    + ClearCanvas           # Clear the entire grid #
    + PaintRow(Row)         # Fill the specified row with the current emoji #
  in

  let model_init: Model = (
    [["","",""],["","",""],["","",""]], # Initial 3x3 empty grid #
    "😄",                               # Initial selected emoji #
    ["😄", "😅", "😆", "😉", "😊"]        # Available emojis #
  ) in

  let setCell: (Canvas, Row, Col, Emoji) -> Canvas =
    fun (canvas, row, col, emoji) -> mapi(
      canvas, 
      fun (i, r) ->
        if i == row 
        then mapi(
          r,
          fun (j, c) ->
            if j == col 
            then emoji 
            else c) 
        else r) 
  in

  let setRow: (Canvas, Row, Emoji) -> Canvas =
    fun (canvas, targetRow, emoji) ->
      mapi(
        canvas,
        fun (i, row) ->
          if i == targetRow 
          then map(row, fun _ -> emoji) 
          else row) 
  in

  let setAll: (Canvas, Emoji) -> Canvas =
    fun (canvas, emoji) ->
      map(canvas, fun r -> map(r, fun _ -> emoji)) 
  in

  let updateGrid: (Model, Canvas -> Canvas) -> Model =
    fun (m, f) ->
      (f(m.canvas), m.brush, m.palette) 
  in

  # Update the EmojiPaint app model based on an action #
  let update: (Model, Action) -> Model =
    ?
  in

  let do = fun (init: Model, actions: [Action]) ->
    fold_left(actions, update, init) 
  in
prompt: |
  Write the EmojiPaint update function
tests: |
  # EMOJIPAINT MVU TESTS #

  test 
    let (grid, _, _) = update(model_init, PaintCell(0, 0)) in
    grid == [["😄","",""],["","",""],["","",""]] 
  end;

  test
    let (grid, _, _) = update(model_init, PaintRow(1)) in
    grid == [["","",""],["😄","😄","😄"],["","",""]] 
  end;

  test
    let model = update(model_init, SetBrush(1)) in
    let (grid, selectedEmoji, _) = update(model, PaintCell(2, 2)) in
    grid == [["","",""],["","",""],["","","😅"]] && selectedEmoji == "😅" 
  end;
      
  test
    let model = update(model_init, PaintRow(0)) in
    let (grid, _, _) = update(model, ClearCell(0, 1)) in
    grid == [["😄","","😄"],["","",""],["","",""]] 
  end;

  test
    let model = update(model_init, PaintCell(1, 1)) in
    let (grid, _, _) = update(model, ClearCanvas) in
    grid == [["","",""],["","",""],["","",""]] 
  end;

  test
    let (_, selectedEmoji, _) = update(model_init, SetBrush(4)) in
    let (grid_init, _, emojiList_init) = model_init in
    let (grid, _, _) = update((grid_init, selectedEmoji, emojiList_init), PaintCell(1, 2)) in
    grid == [["","",""],["","","😊"],["","",""]] 
  end;
    
  test
    let (_, selectedEmoji, emojiList) = model_init in
    let model = update(model_init, PaintRow(2)) in
    let (grid, _, _) = update(model, ClearCell(2, 0)) in
    grid == [["","",""],["","",""],["","😄","😄"]] 
  end;

  test
    let model = update(model_init, PaintCell(0, 0)) in
    let model = update(model, PaintCell(1, 1)) in
    let model = update(model, PaintCell(2, 2)) in
    let (grid, _, _) = update(model, ClearCanvas) in
    grid == [["","",""],["","",""],["","",""]] 
  end;
          
  test
    let (grid_init, _, emojiList_init) = model_init in
    let model = update(model_init, PaintRow(0)) in
    let (_, selectedEmoji, _) = update(model, SetBrush(2)) in
    let (grid,_,_) = model in
    let (grid, _, _) = update((grid, selectedEmoji, emojiList_init), PaintCell(1, 1)) in
    grid == [["😄","😄","😄"],["","😆",""],["","",""]] 
  end;
    
  test
    let model = update(model_init, PaintCell(0, 0)) in
    let model = update(model, PaintRow(2)) in
    let (grid, _, emojiList) = model in
    let model = update(model, SetBrush(3)) in
    let model = update(model, PaintCell(1, 1)) in
    let model = update(model, ClearCell(2, 2)) in
    let (grid, selectedEmoji, _) = model in
    grid == [["😄","",""],["","😉",""],["😄","😄",""]] && selectedEmoji == "😉" 
  end;