# General notes on github actions: Note that both the working directory
# and environment variables generally are not shared between steps.
name: Build and Deploy Hazel
on:
  push:
    # Merge-queue temp branches (gh-readonly-queue/<base>/pr-<n>-<sha>) must
    # not deploy -- they would publish speculative merges to
    # hazel.org/build/gh-readonly-queue/... This is what blocked a previous
    # merge-queue rollout. See issue #2203.
    branches-ignore:
      - "gh-readonly-queue/**"

# There is deliberately no pull_request trigger. A push to a branch with an
# open PR emits both events, and since the quick suite is a strict subset of
# the full one, the extra run would add no signal while paying for a second
# toolchain setup. One push produces one run; the Test job picks which suite
# to run based on whether the branch has an open PR.
concurrency:
  # Per-branch group so cross-branch runs don't evict each other from the queue
  # (a global group has queue depth 1, so a third concurrent run cancels
  # whichever was queued). The push-retry loop in the deploy step handles the
  # cross-branch race on hazelgrove/build's main ref.
  # cancel-in-progress: true so a newer commit on the same branch supersedes an
  # older in-flight run rather than deploying stale output.
  group: hazel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch previews are deliberately not gated on tests: a red suite should
  # not stop you from looking at your branch. Tests run in parallel in Test.
  Deploy:
    name: Deploy branch preview
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    steps:
      # NOTE: position the below lines in the code between two steps
      # and uncomment them to open an ssh connection at that point:
      #- name: Debugging with ssh
      #  uses: lhotari/action-upterm@v1
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4
      - name: Add the name of the current branch to the environment as BRANCH_NAME
        uses: nelonoel/branch-name@v1.0.1
      - uses: ./.github/actions/setup-hazel-toolchain
      # No @src/fmt here: it used to be built with --auto-promote, so the
      # reformatting was written into a throwaway checkout and discarded. The
      # Test job now checks formatting for real.
      - name: Build Release
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release
      - name: Checkout the website build artifacts repo
        uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          token: ${{ secrets.ACCESS_TOKEN }}
          path: build-target
          sparse-checkout: |
            ${{ env.BRANCH_NAME }}
      - name: Clear any old build of this branch
        run: if [ -d "${BRANCH_NAME}" ] ; then rm -rf "${BRANCH_NAME}" ; fi
        working-directory: ./build-target
      - name: Copy in the newly built source
        run: mkdir -p "./build-target/${BRANCH_NAME}" && cp -r "./_build/default/src/web/www"/* "./build-target/${BRANCH_NAME}"
      - name: Commit to the website aka deploy
        run: |
          git config user.name github-deploy-action
          git config user.email hazel-deploy@hazel.org
          git add -A
          git pull --no-edit
          git status
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "github-deploy-action-${BRANCH_NAME}"
          for i in $(seq 1 10); do
            git push && exit 0
            echo "Push failed (attempt $i), pulling and retrying..."
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --no-edit
          done
          echo "Push failed after 10 attempts"
          exit 1
        working-directory: ./build-target

  Test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      # For the open-PR lookup below.
      pull-requests: read
    steps:
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hazel-toolchain
      # The full suite is ~14min, most of it Slow-tagged QCheck property tests.
      # Worth paying on dev and on anything under review; not worth paying on
      # every push to a scratch branch nobody is reading yet. The PR number is
      # captured here too so Codecov can attribute coverage to the PR -- on a
      # push event github.event.number is empty.
      - name: Is the full suite warranted?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq 'first.number // empty')
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            echo "Ref is dev; running the full suite."
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$pr" ]; then
            echo "Branch has open PR #${pr}; running the full suite."
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open PR for this branch; running the quick suite only."
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      # Fails on violation rather than auto-promoting, so a misformatted commit
      # is reported instead of silently rewritten in a throwaway checkout.
      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev
      - name: Run quick tests
        if: steps.scope.outputs.full != 'true'
        run: opam exec -- make ci-quick
        timeout-minutes: 20
      - name: Run full tests
        if: steps.scope.outputs.full == 'true'
        run: opam exec -- make ci
        timeout-minutes: 20
      - name: Test Report
        if: always() && steps.scope.outputs.full == 'true'
        uses: dorny/test-reporter@v1
        with:
          name: Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true # Use an empty test report to detect when something failed with the test runner
      - name: Send coverage report to Codecov
        if: steps.scope.outputs.full == 'true'
        run: opam exec -- bisect-ppx-report send-to Codecov --verbose
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ steps.scope.outputs.pr }}
