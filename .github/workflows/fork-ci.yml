# The same checks as ci.yml, for the one case ci.yml cannot see: a pull request
# from a fork. A fork's branch pushes happen in the fork, so no `push` event
# reaches this repository and `pull_request` is the only trigger that fires.
#
# Guarded to forks so a same-repo pull request -- which ci.yml already covers
# via `push` -- does not run everything a second time. That leaves a skipped
# check on same-repo pull requests, which is the intended reading: this workflow
# is the fork path and it did not apply.
name: Fork CI

on:
  pull_request:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event.pull_request.head.repo.fork }}
    uses: ./.github/workflows/checks.yml
    # No secrets, so no CODECOV_TOKEN to upload with. The test reports are job
    # summaries rather than check runs, so they need no token and still render.
    with:
      upload-coverage: false
