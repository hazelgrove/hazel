# (Since ^ticket(513)'s fix: three builds side by side in every job. PRE, #2635 before today's #2469 (9933091a99, deploy
# 0b8ca9bbcf); NOW, #2635 with it (e4f9cd4192, deploy 0b39d97af4); FIX, NOW with the eval request shared on top of #2469's
# pieces (branch perf/2635-share-pieces, 89a6120699, deploy c910350316). The earlier runs: release_timing.mjs, the plain timing (run 39629706470), and
# release_probe.mjs on PRE and the merge (run 39640161622).)
# Kids' Choice slider releases on GitHub's machines, never the laptop. An orphan branch: only this workflow runs. Each of
# eight jobs serves the three deployed builds from hazelgrove/build (no compiling) and probes 12 releases of the eye-size
# slider on each, in the order pre, now, fix, then fix, now, pre, each in a Chrome started fresh, so the runner's own
# speed and any drift cancel out (runner types differ widely). The first release after load is kept apart from the rest.
name: Release probe (#2635 before #2469, with it, and with the fix; ^ticket(513))

on:
  push:
    branches:
      - "timing/2635-release"

env:
  PRE: 0b8ca9bbcfa694231a7f6bd77ab8f4eb54cc1a5e
  NOW: 0b39d97af440196248eccb8e2d0a6542c0179621
  FIX: c910350316415dab0c0dc05ebb0dacbf1a45f1f6
  DIR: integration/livelits-modular-editors
  FIX_DIR: perf/2635-share-pieces

jobs:
  three:
    name: Pre, now and fix (${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [r1, r2, r3, r4, r5, r6, r7, r8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          ref: ${{ env.PRE }}
          path: pre
          sparse-checkout: ${{ env.DIR }}
      - uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          ref: ${{ env.NOW }}
          path: now
          sparse-checkout: ${{ env.DIR }}
      - uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          ref: ${{ env.FIX }}
          path: fix
          sparse-checkout: ${{ env.FIX_DIR }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The runner; serve the three builds
        run: |
          mkdir -p out
          { echo "job: ${{ matrix.job }}"; lscpu | grep -E 'Model name|^CPU\(s\)'; google-chrome --version; } | tee out/runner.txt
          ls pre/$DIR | head; ls now/$DIR | head; ls fix/$FIX_DIR | head
          (cd pre/$DIR && python3 -m http.server 8133 --bind 127.0.0.1 > /dev/null 2>&1 &)
          (cd now/$DIR && python3 -m http.server 8134 --bind 127.0.0.1 > /dev/null 2>&1 &)
          (cd fix/$FIX_DIR && python3 -m http.server 8135 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:8133/ > /dev/null && curl -sf http://127.0.0.1:8134/ > /dev/null && curl -sf http://127.0.0.1:8135/ > /dev/null && break; sleep 1; done
      - name: Twelve releases each, probed (main thread, worker messages), pre, now, fix, then fix, now, pre
        continue-on-error: true
        shell: bash
        run: |
          round=0
          for side in pre now fix fix now pre; do
            round=$((round + 1))
            port=$(case $side in pre) echo 8133;; now) echo 8134;; fix) echo 8135;; esac)
            (google-chrome --headless=new --mute-audio --no-first-run --no-default-browser-check \
              --remote-debugging-port=9222 --remote-allow-origins='*' \
              --user-data-dir="$RUNNER_TEMP/chrome-$round" about:blank > "out/chrome-$round.log" 2>&1 &)
            for i in $(seq 60); do curl -sf http://127.0.0.1:9222/json/version > /dev/null && break; sleep 1; done
            node scripts/release_probe.mjs 9222 "http://127.0.0.1:$port" "$side-$round" 12 > "out/$side-$round.json"; head -c 400 "out/$side-$round.json"; echo
            pkill -x chrome || true; pkill -x google-chrome || true; sleep 3
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-probe-${{ matrix.job }}
          path: out/
