# An advisory performance report on every ready-for-review pull request into
# dev: the head against its merge base with dev. See docs/performance.md for
# what it measures and what counts as significant.
#
# Advisory: it is not, and should not be made, a required check. Wall time on
# a shared runner is too noisy to gate on; the deterministic step budgets in
# test/evaluator/Test_PerfBudgets.re (part of Fast checks) are the gate. The
# report job succeeds whatever it finds, and fails only if the tooling breaks.
# A head whose harness crashes or hangs (where the base's ran) is a finding,
# reported as significant, not a tooling failure.
#
# The full tables are in the report job's summary (click into the check). A PR
# comment is posted only for a significant change, and is the one comment:
# updated in place while the change persists, marked resolved (keeping the old
# report, collapsed) once a push no longer shows it, and replaced by a new
# comment, which notifies, if a later push makes a change significant again.
#
# Two jobs, so that the one running the pull request's code holds no write
# token. `Performance report` builds and runs PR code with a read-only token;
# `comment` never checks out code, only reads the report's artifact, and is
# skipped for forks (whose pull_request runs get a read-only token anyway).
name: Performance report

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]

concurrency:
  # A newer push to the same PR supersedes the run in flight.
  group: perf-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Performance report
    # Drafts are skipped: the report runs again when one is marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Without this, GitHub's 360-min default applies. A harness that hangs is
    # stopped after 15 minutes per run (bench/perf_report.py), well inside it.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The PR head itself, not the merge commit a pull_request run checks out
      # by default: the report compares the branch with where it left dev.
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # From the base commit recorded in the event, not dev's live tip: dev
      # moving on mid-run (or the PR being merged) must not change what this
      # run, or a re-run of it, compares against.
      - name: Find the merge base with dev
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The compare API answers without a deep clone of either branch.
        run: |
          sha=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          echo "Merge base: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Under _perf, which dune ignores (a leading underscore), so the base is
      # not mistaken for part of the head's workspace.
      - name: Checkout the merge base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: _perf/base
          persist-credentials: false

      # The head's toolchain and lock file serve both builds. A PR that bumps
      # dependencies is therefore measured on the new ones for both sides.
      - uses: ./.github/actions/setup-hazel-toolchain

      # Builds both sides (the head's harness copied into the base, or the
      # base's own if the head's does not build there) and alternates their
      # timing rounds in this one job, so both see the same machine.
      # DUNE_CACHE lets the second build reuse the first's unchanged modules.
      - name: Measure base and head
        run: |
          export DUNE_CACHE=enabled
          bench/perf-compare.sh --rounds 5 --reps 5 --out _perf/report _perf/base

      - name: Write the job summary
        run: |
          {
            echo "## Performance report"
            echo
            cat _perf/report/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Also when measuring failed, for the build logs. The comment job only
      # runs after a successful report job, so a partial upload is never
      # commented on.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            _perf/report/report.json
            _perf/report/report.md
            _perf/report/comment.md
            _perf/report/significant
            _perf/report/build-*.log
          retention-days: 14

  comment:
    name: Comment on a significant change
    needs: report
    # Fork PRs get a read-only token, so this could not comment anyway.
    # Compared by name rather than `head.repo.fork == false`, which is also
    # true when the fork has been deleted (head.repo is null).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: perf-report
          path: perf-report

      # One sticky comment, found by its marker:
      #   significant, no comment yet           -> post one
      #   significant, comment shows a change   -> replace its report in place
      #   significant, comment says resolved    -> delete it and post a new
      #                                            one: an edit notifies no one
      #   not significant, comment              -> mark it resolved, old
      #                                            report collapsed
      #   not significant, no comment           -> nothing
      # A run for a commit that is no longer the PR's head (a re-run of an old
      # run) does nothing, so it cannot overwrite newer results.
      - name: Post, update or resolve the comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- hazel-perf-report -->';
            const RESOLVED = '<!-- hazel-perf-report:resolved -->';
            const START = '<!-- report-start -->';
            const END = '<!-- report-end -->';

            // What to do, from this run's finding and the sticky comment's
            // body (null if there is none).
            function decide(significant, existingBody) {
              if (existingBody == null) return significant ? 'create' : 'nothing';
              if (!significant) return 'resolve';
              return existingBody.includes(RESOLVED) ? 'recreate' : 'update';
            }

            const significant =
              fs.readFileSync('perf-report/significant', 'utf8').trim() === 'true';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha.slice(0, 7);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: live } = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number,
            });
            if (live.head.sha !== pr.head.sha) {
              core.info(`This run is for ${sha}, but the PR's head is now ` +
                `${live.head.sha.slice(0, 7)}: leaving the comment to its run.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.filter(
              c => c.user.login === 'github-actions[bot]' && c.body.includes(MARKER)).pop();
            const action = decide(significant, existing ? existing.body : null);
            core.info(`Significant: ${significant}; comment: ` +
              `${existing ? existing.html_url : 'none'}; action: ${action}`);

            let body;
            if (action === 'nothing') {
              return;
            } else if (action === 'resolve') {
              const prev = existing.body;
              const i = prev.indexOf(START), j = prev.indexOf(END);
              const old = i >= 0 && j > i ? prev.slice(i, j + END.length) : '';
              body = [
                MARKER,
                RESOLVED,
                '## Performance report',
                '',
                `✅ **Resolved** as of ${sha}: no significant change any more ` +
                  `([job summary](${run})).`,
                '',
                '<details><summary>Previous report</summary>',
                '',
                old,
                '',
                '</details>',
              ].join('\n');
            } else {
              const report = fs.readFileSync('perf-report/comment.md', 'utf8');
              body = [
                MARKER,
                '## Performance report',
                '',
                START,
                report,
                END,
                '',
                `<sub>As of ${sha}. Full tables in the [job summary](${run}). ` +
                  'This comment is updated on each push, and marked resolved once ' +
                  'a push no longer shows a significant change.</sub>',
              ].join('\n');
            }

            if (action === 'recreate') {
              // Deleted first: if posting then failed, the next run would
              // post afresh, rather than find two comments.
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: existing.id,
              });
              core.info(`Deleted the resolved comment ${existing.html_url}`);
            }
            if (action === 'update' || action === 'resolve') {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated comment ${existing.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
              core.info(`Posted comment ${data.html_url}`);
            }
