name: Performance Benchmarks

on:
  issue_comment:
    types: [created]

jobs:
  benchmark:
    # Only run on PR comments containing /perf
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/perf')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Post in-progress comment
        id: status_comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Performance Benchmarks\n\n:hourglass_flowing_sand: Running... [View workflow](${runUrl})`
            });
            core.setOutput('comment_id', comment.id);

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('base_sha', pr.data.base.sha);

      # --- Checkout PR branch ---
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      # --- Toolchain setup ---
      - name: Install node/npm
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.0
          dune-cache: true

      - name: Cache opam switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: ${{ runner.os }}-opam-${{ hashFiles('hazel.opam.locked') }}
          restore-keys: |
            ${{ runner.os }}-opam-

      - name: Add opam repository archive
        run: |
          eval $(opam env)
          export OPAMYES=1
          opam repo add archive git+https://github.com/ocaml/opam-repository-archive

      # --- Benchmark HEAD ---
      - name: Setup zarith (head)
        run: opam exec -- make setup-zarith

      - name: Build and run benchmarks (head)
        run: |
          npm install
          bash bench/build-and-run.sh > head_results.json

      # --- Benchmark base branch ---
      - name: Checkout and build base
        run: |
          BASE_SHA="${{ steps.pr.outputs.base_sha }}"

          # Create worktree at base commit
          git worktree add /tmp/base-bench "$BASE_SHA" --detach

          # Copy head's bench/ to base if it doesn't have one
          if [ ! -d /tmp/base-bench/bench ]; then
            cp -r bench /tmp/base-bench/bench
          fi

          cd /tmp/base-bench
          npm install
          opam exec -- make setup-zarith 2>/dev/null || true
          bash bench/build-and-run.sh > "$GITHUB_WORKSPACE/base_results.json" || echo "[]" > "$GITHUB_WORKSPACE/base_results.json"
          cd "$GITHUB_WORKSPACE"

          git worktree remove /tmp/base-bench --force 2>/dev/null || true
        continue-on-error: true

      # --- Compare and post results ---
      - name: Compare results and post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const baseSha = '${{ steps.pr.outputs.base_sha }}'.slice(0, 7);
            const headSha = '${{ steps.pr.outputs.head_sha }}'.slice(0, 7);
            const baseRef = '${{ steps.pr.outputs.base_ref }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body = `## Performance Benchmark Results\n\n`;
            body += `**Base:** \`${baseRef}\` @ [\`${baseSha}\`](../commit/${baseSha})\n`;
            body += `**PR:** [\`${headSha}\`](../commit/${headSha})\n\n`;

            try {
              const table = execSync(
                'node bench/compare.js base_results.json head_results.json --markdown',
                { encoding: 'utf8' }
              );
              body += table;
            } catch (e) {
              body += `:x: Comparison failed. Check the [workflow log](${runUrl}).\n\n`;
              body += `\`\`\`\n${e.stderr || e.message}\n\`\`\``;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.status_comment.outputs.comment_id }},
              body: body
            });
