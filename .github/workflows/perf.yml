name: Performance Benchmarks

on:
  issue_comment:
    types: [created]

jobs:
  benchmark:
    # Only run on PR comments containing /perf
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/perf')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Post in-progress comment
        id: status_comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Performance Benchmarks\n\n:hourglass_flowing_sand: Running... [View workflow](${runUrl})`
            });
            core.setOutput('comment_id', comment.id);

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('base_sha', pr.data.base.sha);

      - name: Install node/npm
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.0
          dune-cache: true

      - name: Cache opam switch
        uses: actions/cache@v4
        with:
          path: "_opam"
          key: ${{ runner.os }}-opam-${{ hashFiles('./base/hazel.opam.locked') }}

      - name: Add opam repository archive
        run: |
          eval $(opam env)
          export OPAMYES=1
          opam repo add archive git+https://github.com/ocaml/opam-repository-archive

      # --- Benchmark the base branch ---
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: base

      - name: Install NPM dependencies (base)
        run: npm install
        working-directory: ./base

      - name: Install dependencies (base)
        run: |
          eval $(opam env)
          export OPAMYES=1
          opam install ./base --deps-only --locked

      - name: Setup zarith (base)
        run: opam exec -- make setup-zarith
        working-directory: ./base

      - name: Build and run benchmarks (base)
        run: |
          eval $(opam env)
          export DUNE_CACHE=enabled
          dune build bench/hazel_bench.bc.js
          node --stack-size=8192 _build/default/bench/hazel_bench.bc.js --json 2>&1 | sed -n '/^\[/,/^\]/p' > ../base_results.json
        working-directory: ./base
        continue-on-error: true

      # --- Benchmark the PR branch ---
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: head

      - name: Install NPM dependencies (head)
        run: npm install
        working-directory: ./head

      - name: Install dependencies (head)
        run: |
          eval $(opam env)
          export OPAMYES=1
          opam install ./head --deps-only --locked

      - name: Setup zarith (head)
        run: opam exec -- make setup-zarith
        working-directory: ./head

      - name: Build and run benchmarks (head)
        run: |
          eval $(opam env)
          export DUNE_CACHE=enabled
          dune build bench/hazel_bench.bc.js
          node --stack-size=8192 _build/default/bench/hazel_bench.bc.js --json 2>&1 | sed -n '/^\[/,/^\]/p' > ../head_results.json
        working-directory: ./head

      # --- Compare and post results ---
      - name: Compare results and post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let baseResults = [];
            let headResults = [];
            try {
              baseResults = JSON.parse(fs.readFileSync('base_results.json', 'utf8'));
            } catch (e) {
              console.log('No base results (benchmark may not exist on base branch)');
            }
            headResults = JSON.parse(fs.readFileSync('head_results.json', 'utf8'));

            const baseSha = '${{ steps.pr.outputs.base_sha }}'.slice(0, 7);
            const headSha = '${{ steps.pr.outputs.head_sha }}'.slice(0, 7);
            const baseRef = '${{ steps.pr.outputs.base_ref }}';

            // Build lookup from base results
            const baseMap = {};
            for (const r of baseResults) {
              baseMap[r.name] = r.time_ns;
            }

            // Format nanoseconds nicely
            function formatTime(ns) {
              if (ns === undefined || ns === 0 || isNaN(ns)) return '-';
              if (ns >= 1e9) return (ns / 1e9).toFixed(2) + ' s';
              if (ns >= 1e6) return (ns / 1e6).toFixed(2) + ' ms';
              if (ns >= 1e3) return (ns / 1e3).toFixed(2) + ' us';
              return ns.toFixed(0) + ' ns';
            }

            function formatDelta(base, head) {
              if (!base || base === 0 || isNaN(base)) return 'new';
              if (head === 0 || isNaN(head)) return '-';
              const pct = ((head - base) / base * 100);
              const sign = pct >= 0 ? '+' : '';
              const emoji = pct > 10 ? ' :warning:' : pct < -10 ? ' :rocket:' : '';
              return `${sign}${pct.toFixed(1)}%${emoji}`;
            }

            // Split into edit-cycle and memo sections
            const editResults = headResults.filter(r => r.name.includes('/edit/'));
            const memoResults = headResults.filter(r => r.name.includes('/memo/'));

            function makeTable(results) {
              let table = '| Benchmark | Base | PR | Delta |\n';
              table += '|:---|---:|---:|---:|\n';
              for (const r of results) {
                const baseTime = baseMap[r.name];
                table += `| \`${r.name}\` | ${formatTime(baseTime)} | ${formatTime(r.time_ns)} | ${formatDelta(baseTime, r.time_ns)} |\n`;
              }
              return table;
            }

            let body = `## Performance Benchmark Results\n\n`;
            body += `**Base:** \`${baseRef}\` @ [\`${baseSha}\`](../commit/${baseSha})\n`;
            body += `**PR:** [\`${headSha}\`](../commit/${headSha})\n\n`;

            body += `### Edit Cycle (per-keystroke latency)\n\n`;
            body += makeTable(editResults);
            body += '\n';

            if (memoResults.length > 0) {
              body += `<details><summary>Memo-hit overhead (repeated calls, same input)</summary>\n\n`;
              body += makeTable(memoResults);
              body += `\n</details>\n\n`;
            }

            body += `<details><summary>Legend</summary>\n\n`;
            body += `- :rocket: = >10% faster\n`;
            body += `- :warning: = >10% slower\n`;
            body += `- "new" = benchmark not present on base branch\n`;
            body += `</details>`;

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.status_comment.outputs.comment_id }},
              body: body
            });
