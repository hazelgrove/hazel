name: Update Dependencies

on:
  schedule:
    - cron: '0 9 * * *'  # everyday at 09:00 UTC
  workflow_dispatch:
    
permissions: # Necessary for created pull request to trigger CI
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout `dev`
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # fetch full history for branch operations

      - name: Install node/npm
        uses: actions/setup-node@v4
        with:
            node-version: "latest"

      - name: Install NPM dependencies
        run: npm install

      # No pin here, deliberately: `make change-deps` moves the pins forward to
      # the current repository heads and repins this switch to them itself, so
      # the regenerated lock file and .github/opam-pins.env always describe the
      # same repository state. Discovering newer packages is this workflow's
      # whole purpose. See issue #2334.
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.0
          # Off deliberately: setup-ocaml keys its dune cache on the run id, so
          # it is never an exact hit, but uploads ~1.7GB every run. That churn
          # evicts the opam switch cache other workflows depend on (10GB
          # repo-wide limit).
          dune-cache: false

      - name: Install dune
        run: |
          eval $(opam env)
          export OPAMYES=1
          opam install dune
  
      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Moves .github/opam-pins.env to the current repository heads, repins this
      # switch to them (which is also what adds the archive repository), then
      # re-locks. The PR below therefore carries the new lock file and the new
      # pin in one commit.
      - name: Run change-deps
        run: |
           eval $(opam env)
           export OPAMYES=1
           make change-deps
           git diff --stat hazel.opam.locked .github/opam-pins.env

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HAZEL_DEPENDENCIES }}
          title: "chore: update dependencies"
          body: "Automated update from `make change-deps` based on `dev`."
          commit-message: "chore: update dependencies"
          branch: bot-update-deps
          base: dev
          delete-branch: true
