# Authoritative CI. This is the workflow whose status should gate review and,
# once the merge queue lands (issue #2203 phase 4), gate merging.
#
# Routing is by trigger, not by asking the API what kind of ref this is. An
# earlier version of this pipeline ran on `push` only and called `gh pr list` to
# decide how much to test. That could not see fork PRs at all (they never push
# to this repo, so nothing ran), raced with PR creation, and could not serve as a
# meaningful required status check. `pull_request` already means "under review".
name: CI

on:
  # All default activity types, including synchronize, and it fires for forks.
  pull_request:
  # Post-merge validation of dev itself.
  push:
    branches: [dev]
  # Speculative merge commits, once a merge queue is enabled.
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    steps:
      - name: Checkout the hazel repo
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      # Fails on violation rather than auto-promoting, so a misformatted commit
      # is reported instead of silently rewritten in a throwaway checkout.
      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev

      # The strict-warning gate: release sets `-warn-error +A-58` while dev sets
      # `-warn-error -A` (see the (env) stanzas in src/*/dune). It lives here
      # rather than only in deploy.yml so that fork PRs -- which never trigger
      # deploy.yml -- cannot land a warning that only breaks dev after merge.
      - name: Build release
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release

      - name: Run tests
        run: opam exec -- make ci
        timeout-minutes: 20

      # Annotations, not the gate -- `Run tests` above exits non-zero by itself.
      # fail-on-error stays on as a cheap regression guard in case the runner
      # ever stops propagating its status again.
      #
      # Skipped on forks: GitHub caps their token to read-only regardless of the
      # permissions block above, so publishing a check run would fail and turn
      # every fork PR red. They still gate on the exit status like everything
      # else, they just get no annotated report.
      - name: Test Report
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        uses: dorny/test-reporter@v1
        with:
          name: Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true # Use an empty test report to detect when something failed with the test runner

      # Fork PRs get a read-only token with no access to secrets, so the upload
      # would fail rather than add anything. Tests still run and still gate.
      - name: Send coverage report to Codecov
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        run: opam exec -- bisect-ppx-report send-to Codecov --verbose
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
