# The full test suite, and the status to require on dev once the merge queue
# lands (issue #2203). Branch previews are deploy.yml's job, not this one.
name: CI

on:
  pull_request: # also covers forks, which never fire deploy.yml
  push:
    branches: [dev] # post-merge validation
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    # Without this, GitHub's 360-min default applies.
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    steps:
      - name: Checkout the hazel repo
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      # deploy.yml already runs the three gates below on every branch push, so
      # here they cover only what a `push` cannot reach: forks, which never fire
      # one, and the merge queue, which deploy.yml excludes. `merge_group` is
      # load-bearing -- github.event.pull_request is null there, so the fork test
      # alone is false and the queue would silently lose all three. Step-level
      # rather than job-level, because a job-level `if` still emits a `skipped`
      # check run.
      - name: Check formatting
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork == true }}
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev

      # Strict warnings over src -- dune's release profile promotes them to
      # errors -- and the only step that validates js_of_ocaml linking.
      - name: Build release
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork == true }}
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release

      # The same strictness over test/, which no release build reaches (issue
      # #2456). Type-check only, so it does not relink the test bundle.
      - name: Check warnings
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork == true }}
        run: |
          export DUNE_CACHE=enabled
          opam exec -- make ci-check

      - name: Run tests
        run: opam exec -- make ci
        # Headroom over the ~32-min suite is under 2x; check the trend before
        # adding another expensive one.
        timeout-minutes: 60

      # Results UI, not the gate: the step above already fails on a red suite.
      # Skipped on forks, whose token is read-only, so publishing a check run
      # would fail and mark the whole PR red.
      - name: Test Report
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        uses: dorny/test-reporter@v1
        with:
          name: Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          # True would add a confusing second "no report found" failure on top
          # of a compile error the job has already failed on.
          fail-on-empty: false
          # True (the default) writes to the job summary and creates no check
          # run, leaving no `Test Report` status to link to or require.
          use-actions-summary: false

      # Forks get no secrets, so the upload would fail rather than add anything.
      - name: Send coverage report to Codecov
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        run: opam exec -- bisect-ppx-report send-to Codecov --verbose
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
