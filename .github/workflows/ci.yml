name: CI

on:
  pull_request:
  push:
    branches: [dev]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hazel-toolchain
      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt

  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hazel-toolchain
      - name: Build release
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-www
          path: _build/default/src/web/www
          retention-days: 7
          if-no-files-found: error

  test-quick:
    name: Quick tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hazel-toolchain
      - name: Run quick tests
        run: opam exec -- make test-quick

  test-slow:
    name: Full tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-hazel-toolchain
      - name: Run full test suite
        run: opam exec -- make ci
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
      - name: Send coverage to Codecov
        if: success()
        run: opam exec -- bisect-ppx-report send-to Codecov --verbose
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.number }}
