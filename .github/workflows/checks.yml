# The checks themselves, called by ci.yml (in-repo pushes and the merge queue)
# and by fork-ci.yml (pull requests from forks). Defined once here so the two
# entry points differ only in what triggers them.
#
# Two jobs, no `needs:` between them: they start together, and either can be
# re-run alone. The split is by cost, not by concern -- `Fast checks` bundles
# formatting, warnings and the quick suite because each extra job re-installs
# the toolchain, which costs more than the work those checks do. Revisit if
# the build ever becomes an artifact the jobs can share.
name: Checks

on:
  workflow_call:
    inputs:
      upload-coverage:
        description: >
          Send the coverage report to Codecov. Off for fork pull requests: they
          get no secrets, so the upload has no token. The test reports
          themselves are job summaries and need nothing, so they run either way.
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  Fast:
    name: Fast checks
    runs-on: ubuntu-latest
    # Without this, GitHub's 360-min default applies.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the hazel repo
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      # No --auto-promote: a misformatted commit should fail, not be rewritten
      # into a checkout that is then thrown away.
      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev

      # Strict warnings over src and test/. dune's release profile promotes them
      # to errors; @check type-checks both trees without linking, so this costs
      # no second js_of_ocaml build (issue #2456).
      - name: Check warnings
        run: |
          export DUNE_CACHE=enabled
          opam exec -- make ci-check

      # alcotest's -q filter drops the Slow-tagged cases, which dominate the
      # full suite's wall clock. That is what makes a test signal here, rather
      # than only in `Full tests`, affordable. Slow is a speed tag and not a
      # synonym for QCheck -- most Slow-tagged cases are ordinary tests.
      - name: Run quick tests
        run: opam exec -- make ci-quick
        timeout-minutes: 20

      # Results UI, not the gate: the steps above already fail the job.
      - name: Quick Test Report
        if: ${{ always() }}
        uses: dorny/test-reporter@v3
        with:
          name: Quick Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          # An earlier step failing leaves no report to read, and the job is
          # already red for that reason -- don't stack a second failure on it.
          fail-on-empty: false
          # use-actions-summary defaults to true: the report is written to this
          # job's summary and no check run is created. That is deliberate. A
          # check run is created for a commit, not for a workflow, and GitHub
          # picks which of the commit's check suites it joins -- it used to pick
          # Deploy's, so the test results rendered under "Deploy branch preview"
          # and a red suite made the deploy look broken. The summary is the only
          # placement that is actually ours to choose. Nothing is lost as a
          # gate: `Fast checks` and `Full tests` are the statuses to require,
          # and the steps above already fail them.

  Full:
    name: Full tests
    runs-on: ubuntu-latest
    # Without this, GitHub's 360-min default applies.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the hazel repo
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Run tests
        run: opam exec -- make ci
        timeout-minutes: 60

      # Results UI, not the gate: the step above already fails on a red suite.
      - name: Test Report
        if: ${{ always() }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          # See Quick Test Report above for this and for the summary default.
          fail-on-empty: false

      - name: Send coverage report to Codecov
        if: ${{ inputs.upload-coverage }}
        run: opam exec -- bisect-ppx-report send-to Codecov --verbose
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
