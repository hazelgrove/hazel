# Every branch push: the static gates, a fast test signal, and the preview, one
# concern per job so each failure lands as its own named check. Nothing uses
# `needs:` -- a red suite should not stop you looking at your branch. The full
# suite runs in ci.yml.
name: Deploy

on:
  push:
    # A speculative merge commit must not be published as a branch preview.
    branches-ignore:
      - "gh-readonly-queue/**"

concurrency:
  # Per-branch: a global group has queue depth 1, so a third concurrent run
  # would cancel a queued one. Newer commits supersede in-flight ones rather
  # than deploying stale output.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No release build of src here: the Deploy job below already does one for the
  # preview. `make ci-check` covers what that misses -- test/, type-checked
  # without linking (issue #2456).
  Checks:
    name: Static checks
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      # No --auto-promote: a misformatted commit should fail, not be rewritten
      # into a checkout that is then thrown away.
      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev

      - name: Check warnings
        run: |
          export DUNE_CACHE=enabled
          opam exec -- make ci-check

  Deploy:
    name: Deploy branch preview
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    # Without this, GitHub's 360-min default applies.
    timeout-minutes: 45
    steps:
      # NOTE: position the below lines in the code between two steps
      # and uncomment them to open an ssh connection at that point:
      #- name: Debugging with ssh
      #  uses: lhotari/action-upterm@v1
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - name: Add the name of the current branch to the environment as BRANCH_NAME
        uses: nelonoel/branch-name@v1.0.1

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Build Release
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release

      - name: Checkout the website build artifacts repo
        uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          token: ${{ secrets.ACCESS_TOKEN }}
          path: build-target
          sparse-checkout: |
            ${{ env.BRANCH_NAME }}

      - name: Clear any old build of this branch
        run: if [ -d "${BRANCH_NAME}" ] ; then rm -rf "${BRANCH_NAME}" ; fi
        working-directory: ./build-target

      - name: Copy in the newly built source
        run: mkdir -p "./build-target/${BRANCH_NAME}" && cp -r "./_build/default/src/web/www"/* "./build-target/${BRANCH_NAME}"

      # All branches push to this one repo's main ref, so concurrent deploys
      # collide; retry with rebase until we win.
      - name: Commit to the website aka deploy
        run: |
          git config user.name github-deploy-action
          git config user.email hazel-deploy@hazel.org
          git add -A
          git pull --no-edit
          git status
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "github-deploy-action-${BRANCH_NAME}"
          for i in $(seq 1 10); do
            git push && exit 0
            echo "Push failed (attempt $i), pulling and retrying..."
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --no-edit
          done
          echo "Push failed after 10 attempts"
          exit 1
        working-directory: ./build-target

  # alcotest's -q filter drops the Slow-tagged cases, which are ~92% of the full
  # suite's wall clock -- that is what makes a test signal on every push
  # affordable. It stays a strict subset: -q selects Quick and has no inverse,
  # so a broken quick case reports red here and in the full run too.
  Quick:
    name: Quick tests
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    steps:
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Run quick tests
        run: opam exec -- make ci-quick
        timeout-minutes: 20

      # Results UI, not the gate: the step above already fails on a red suite.
      - name: Quick Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Quick Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          # Both non-default: the job already fails on a red suite without
          # them, and the default summary output creates no check run.
          fail-on-empty: false
          use-actions-summary: false
