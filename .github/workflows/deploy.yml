# Everything that should happen on every branch push: the static gates, a fast
# test signal, and the preview. One concern per job, so each failure lands as its
# own named check rather than a shared red.
#
# Nothing here uses `needs:`. Previews are deliberately not gated on tests or on
# formatting: a red suite should not stop you looking at your branch.
#
# This workflow owns the static gates for same-repo branches; ci.yml repeats them
# guarded to the cases a `push` event cannot reach, so each gate runs once per
# commit. Full-suite CI is ci.yml.
name: Deploy

on:
  push:
    # Queue temp branches must not publish speculative merges as previews. Their
    # CI comes from ci.yml's merge_group trigger instead.
    branches-ignore:
      - "gh-readonly-queue/**"

concurrency:
  # Per-branch: a global group has queue depth 1, so a third concurrent run would
  # cancel a queued one. cancel-in-progress so a newer commit supersedes an older
  # in-flight run rather than deploying stale output.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static gates, on their own check. Deliberately does not build src under
  # release: the Deploy job below already does that for the preview, and that
  # build is what validates js_of_ocaml linking. @check type-checks src *and*
  # test/ without linking, which is the part no other job covers (issue #2456).
  Checks:
    name: Static checks
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      # No --auto-promote: a misformatted commit should fail, not be rewritten
      # into a checkout that is then thrown away.
      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev

      - name: Check warnings
        run: |
          export DUNE_CACHE=enabled
          opam exec -- make ci-check

  Deploy:
    name: Deploy branch preview
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    # No step here has a timeout, and GitHub's default job cap is 360 min.
    timeout-minutes: 45
    steps:
      # NOTE: position the below lines in the code between two steps
      # and uncomment them to open an ssh connection at that point:
      #- name: Debugging with ssh
      #  uses: lhotari/action-upterm@v1
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - name: Add the name of the current branch to the environment as BRANCH_NAME
        uses: nelonoel/branch-name@v1.0.1

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Build Release
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release

      - name: Checkout the website build artifacts repo
        uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          token: ${{ secrets.ACCESS_TOKEN }}
          path: build-target
          sparse-checkout: |
            ${{ env.BRANCH_NAME }}

      - name: Clear any old build of this branch
        run: if [ -d "${BRANCH_NAME}" ] ; then rm -rf "${BRANCH_NAME}" ; fi
        working-directory: ./build-target

      - name: Copy in the newly built source
        run: mkdir -p "./build-target/${BRANCH_NAME}" && cp -r "./_build/default/src/web/www"/* "./build-target/${BRANCH_NAME}"

      # All branches push to this one repo's main ref, so concurrent deploys
      # collide; retry with rebase until we win.
      - name: Commit to the website aka deploy
        run: |
          git config user.name github-deploy-action
          git config user.email hazel-deploy@hazel.org
          git add -A
          git pull --no-edit
          git status
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "github-deploy-action-${BRANCH_NAME}"
          for i in $(seq 1 10); do
            git push && exit 0
            echo "Push failed (attempt $i), pulling and retrying..."
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --no-edit
          done
          echo "Push failed after 10 attempts"
          exit 1
        working-directory: ./build-target

  # `make ci-quick` uses alcotest's -q filter, which drops the Slow-tagged cases
  # -- the large majority of the full suite's wall clock. That is what makes this
  # cheap enough to run on every push.
  #
  # It remains a subset of ci.yml's full run: alcotest has no slow-only filter
  # (-q selects Quick, with no inverse), so a broken quick test reports red here
  # and in `Test`. Removing that overlap needs a speed partition in
  # test/haz3ltest.re plus a @test-slow alias.
  Quick:
    name: Quick tests
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    steps:
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Run quick tests
        run: opam exec -- make ci-quick
        timeout-minutes: 20

      # Annotated results UI, not the gate -- `Run quick tests` exits non-zero on
      # failure by itself.
      - name: Quick Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Quick Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          # See ci.yml for both of these.
          fail-on-empty: false
          use-actions-summary: false
