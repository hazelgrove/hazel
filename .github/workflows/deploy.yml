# Branch previews, plus a fast quick-test signal on every push.
#
# Deliberately NOT the authoritative test workflow -- that is ci.yml, which runs
# on pull_request so it also covers forks. Previews are not gated on tests: a red
# suite should not stop you from looking at your branch.
name: Deploy

on:
  push:
    # Merge-queue temp branches (gh-readonly-queue/<base>/pr-<n>-<sha>) must not
    # deploy -- they would publish speculative merges to
    # hazel.org/build/gh-readonly-queue/... This is what blocked a previous
    # merge-queue rollout. Their CI comes from ci.yml's merge_group trigger.
    branches-ignore:
      - "gh-readonly-queue/**"

concurrency:
  # Per-branch group so cross-branch runs don't evict each other from the queue
  # (a global group has queue depth 1, so a third concurrent run cancels
  # whichever was queued). The push-retry loop below handles the cross-branch
  # race on hazelgrove/build's main ref. cancel-in-progress so a newer commit on
  # the same branch supersedes an older in-flight run rather than deploying
  # stale output.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy:
    name: Deploy branch preview
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    steps:
      # NOTE: position the below lines in the code between two steps
      # and uncomment them to open an ssh connection at that point:
      #- name: Debugging with ssh
      #  uses: lhotari/action-upterm@v1
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - name: Add the name of the current branch to the environment as BRANCH_NAME
        uses: nelonoel/branch-name@v1.0.1

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Build Release
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release

      - name: Checkout the website build artifacts repo
        uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          token: ${{ secrets.ACCESS_TOKEN }}
          path: build-target
          sparse-checkout: |
            ${{ env.BRANCH_NAME }}

      - name: Clear any old build of this branch
        run: if [ -d "${BRANCH_NAME}" ] ; then rm -rf "${BRANCH_NAME}" ; fi
        working-directory: ./build-target

      - name: Copy in the newly built source
        run: mkdir -p "./build-target/${BRANCH_NAME}" && cp -r "./_build/default/src/web/www"/* "./build-target/${BRANCH_NAME}"

      - name: Commit to the website aka deploy
        run: |
          git config user.name github-deploy-action
          git config user.email hazel-deploy@hazel.org
          git add -A
          git pull --no-edit
          git status
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "github-deploy-action-${BRANCH_NAME}"
          for i in $(seq 1 10); do
            git push && exit 0
            echo "Push failed (attempt $i), pulling and retrying..."
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --no-edit
          done
          echo "Push failed after 10 attempts"
          exit 1
        working-directory: ./build-target

  # Fast feedback for long-lived branches that have no PR open yet, where ci.yml
  # does not fire. `make ci-quick` runs the suite under alcotest's -q filter:
  # 3218 of 3296 tests, because the 78 Slow-tagged QCheck property tests are
  # ~95% of the full suite's runtime. On a branch that *does* have a PR this
  # overlaps ci.yml's authoritative run, which is accepted -- it is non-blocking,
  # gives a signal minutes earlier, and avoiding it would mean reintroducing the
  # PR lookup this pipeline was restructured to remove.
  Quick:
    name: Quick tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    steps:
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev

      - name: Run quick tests
        run: opam exec -- make ci-quick
        timeout-minutes: 20

      # Load-bearing, not decorative. test/haz3ltest.re calls run_and_report and
      # discards the `exit` function it returns, which is the only thing that
      # propagates failure -- Alcotest.run is always invoked internally with
      # and_exit=false so a report can be produced. So the test binary exits 0
      # even when tests fail, and `Run quick tests` above cannot go red on its
      # own. This step is what turns a failure into a failed job.
      - name: Quick Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Quick Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true # An empty report means the runner itself failed
