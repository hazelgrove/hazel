# Branch previews on every push, plus a fast test signal. Previews are
# deliberately not gated on tests: a red suite should not stop you looking at
# your branch. Authoritative CI is ci.yml.
name: Deploy

on:
  push:
    # Queue temp branches must not publish speculative merges as previews. Their
    # CI comes from ci.yml's merge_group trigger instead.
    branches-ignore:
      - "gh-readonly-queue/**"

concurrency:
  # Per-branch: a global group has queue depth 1, so a third concurrent run would
  # cancel a queued one. cancel-in-progress so a newer commit supersedes an older
  # in-flight run rather than deploying stale output.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy:
    name: Deploy branch preview
    if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}
    runs-on: ubuntu-latest
    steps:
      # NOTE: position the below lines in the code between two steps
      # and uncomment them to open an ssh connection at that point:
      #- name: Debugging with ssh
      #  uses: lhotari/action-upterm@v1
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - name: Add the name of the current branch to the environment as BRANCH_NAME
        uses: nelonoel/branch-name@v1.0.1

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Build Release
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release

      - name: Checkout the website build artifacts repo
        uses: actions/checkout@v4
        with:
          repository: hazelgrove/build
          token: ${{ secrets.ACCESS_TOKEN }}
          path: build-target
          sparse-checkout: |
            ${{ env.BRANCH_NAME }}

      - name: Clear any old build of this branch
        run: if [ -d "${BRANCH_NAME}" ] ; then rm -rf "${BRANCH_NAME}" ; fi
        working-directory: ./build-target

      - name: Copy in the newly built source
        run: mkdir -p "./build-target/${BRANCH_NAME}" && cp -r "./_build/default/src/web/www"/* "./build-target/${BRANCH_NAME}"

      # All branches push to this one repo's main ref, so concurrent deploys
      # collide; retry with rebase until we win.
      - name: Commit to the website aka deploy
        run: |
          git config user.name github-deploy-action
          git config user.email hazel-deploy@hazel.org
          git add -A
          git pull --no-edit
          git status
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "github-deploy-action-${BRANCH_NAME}"
          for i in $(seq 1 10); do
            git push && exit 0
            echo "Push failed (attempt $i), pulling and retrying..."
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --no-edit
          done
          echo "Push failed after 10 attempts"
          exit 1
        working-directory: ./build-target

  # Test signal for branches with no PR open, where ci.yml does not fire, and the
  # only annotated test UI there. `make ci-quick` uses alcotest's -q filter: 3218
  # of 3296 tests, since the 78 Slow-tagged QCheck tests are ~95% of the full
  # suite's runtime. Overlaps ci.yml on branches that do have a PR, accepted for
  # the earlier signal.
  Quick:
    name: Quick tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    steps:
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Check formatting
        run: opam exec -- dune build @src/fmt @test/fmt --profile dev

      - name: Run quick tests
        run: opam exec -- make ci-quick
        timeout-minutes: 20

      # Annotated results UI, not the gate -- `Run quick tests` exits non-zero on
      # failure by itself.
      - name: Quick Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Quick Test Report
          path: ./_build/default/test/junit_tests*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true
