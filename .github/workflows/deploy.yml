# Branch previews, served at https://build.hazel.org/<branch>/. Deliberately independent of ci.yml: no `needs:`, no shared
# job, nothing to wait on -- a red suite should not stop you looking at your
# branch, which is when you most want to.
#
# Forks never reach this workflow, since a fork's pushes happen in the fork.
# Merge-queue branches are excluded because a speculative merge commit must not
# be published as a preview.
#
# This job's release build is also the only thing that links src/web's `main`
# and `worker` js_of_ocaml executables. The checks in ci.yml type-check without
# linking, and the test bundle links the `web` library but not those two entry
# points.
name: Deploy

on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"

concurrency:
  # Per-branch: a global group has queue depth 1, so a third concurrent run
  # would cancel a queued one. Newer commits supersede in-flight ones rather
  # than deploying stale output.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy:
    name: Deploy branch preview
    runs-on: ubuntu-latest
    # Without this, GitHub's 360-min default applies.
    timeout-minutes: 45
    steps:
      # NOTE: position the below lines in the code between two steps
      # and uncomment them to open an ssh connection at that point:
      #- name: Debugging with ssh
      #  uses: lhotari/action-upterm@v1
      - name: Checkout the hazel repo on the current branch
        uses: actions/checkout@v4

      - name: Add the name of the current branch to the environment as BRANCH_NAME
        uses: nelonoel/branch-name@v1.0.1

      - uses: ./.github/actions/setup-hazel-toolchain

      - name: Build Release
        env:
          # Lets scripts/build-info.sh (the BuildInfo.ml rule) look up the
          # branch's open PR so deployed builds link to it.
          GH_TOKEN: ${{ github.token }}
        run: |
          export DUNE_CACHE=enabled
          opam exec -- dune build src --profile release

      # Previews are served from the hazel-build R2 bucket at
      # build.hazel.org/<branch>/ (hazel.org/build/* redirects there). Each key
      # is live as soon as it is written, so there is no site-wide publish step
      # and branches cannot cancel each other's deploys. Filenames are not
      # content-hashed, so a short max-age lets a new deploy show within minutes
      # while traffic spikes are still served from Cloudflare's cache.
      - name: Upload the build to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Newer aws CLIs send checksum headers R2 may not accept
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync ./_build/default/src/web/www "s3://hazel-build/${BRANCH_NAME}/" \
            --delete \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --no-progress
