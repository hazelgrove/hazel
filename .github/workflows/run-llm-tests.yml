name: LLM Test Report

on:
  push:

# Allow deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # Discover all task YAML files in tasks/ dynamically
  # ---------------------------------------------------------------
  discover-tasks:
    name: Discover Tasks
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.list-tasks.outputs.tasks }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List task files
        id: list-tasks
        run: |
          tasks=$(find tasks -maxdepth 1 \( -name "*.yaml" -o -name "*.yml" \) \
            | sort \
            | xargs -I{} basename {} \
            | sed 's/\.[^.]*$//' \
            | jq -R . | jq -sc .)
          echo "tasks=$tasks" >> $GITHUB_OUTPUT
          echo "Found tasks: $tasks"

  # ---------------------------------------------------------------
  # Run every model × task combination in parallel
  # ---------------------------------------------------------------
  run-tests:
    name: "${{ matrix.model_slug }} × ${{ matrix.task_slug }}"
    runs-on: ubuntu-latest
    needs: discover-tasks

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Tier 1: Frontier ceiling ────────────────────────────
          - model: "openai/gpt-5.2"
            model_slug: "gpt-5-2"
          - model: "anthropic/claude-opus-4.6"
            model_slug: "claude-opus-4-6"

          # ── Tier 2: Frontier strong ─────────────────────────────
          - model: "anthropic/claude-sonnet-4.6"
            model_slug: "claude-sonnet-4-6"
          - model: "openai/gpt-5.2-codex"
            model_slug: "gpt-5-2-codex"
          - model: "google/gemini-2.5-pro"
            model_slug: "gemini-2-5-pro"

          # ── Tier 3: Value / cost-performance ────────────────────
          - model: "moonshotai/kimi-k2"
            model_slug: "kimi-k2"
          - model: "deepseek/deepseek-r1-0528"
            model_slug: "deepseek-r1-0528"
          - model: "google/gemini-2.5-flash"
            model_slug: "gemini-2-5-flash"
          - model: "deepseek/deepseek-v3.2"
            model_slug: "deepseek-v3-2"
          - model: "qwen/qwen3-coder"
            model_slug: "qwen3-coder-480b"

          # Add or remove models here — one entry per model.
          # model:      the OpenRouter model ID passed to --model
          # model_slug: a filename-safe identifier used for artifacts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run task
        run: |
          npx ts-node run-task.ts \
            --task "tasks/${{ matrix.task_slug }}.yaml" \
            --apiKey ${{ secrets.OPENROUTER_API_KEY }} \
            --model "${{ matrix.model }}" \
            --url https://hazel.org/build/project-mode \
            --headless true \
            --outputDir "test-results/${{ matrix.model_slug }}/${{ matrix.task_slug }}" \
            --attemptTimeoutMs 120000 \
            --retries 2

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "results--${{ matrix.model_slug }}--${{ matrix.task_slug }}"
          path: "test-results/${{ matrix.model_slug }}/${{ matrix.task_slug }}/"

  # ---------------------------------------------------------------
  # Collect all results and generate the HTML report
  # ---------------------------------------------------------------
  generate-report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Download all results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results--*
          path: all-results/
          merge-multiple: false

      - name: Flatten and tag results
        run: |
          mkdir -p merged-results
          # Each artifact dir is named results--<model_slug>--<task_slug>
          # We prefix each JSON file with that info so generate-report.js
          # can reconstruct which model+task produced it.
          for dir in all-results/results--*/; do
            name=$(basename "$dir")
            IFS='--' read -ra parts <<< "$name"
            # parts[0]="" parts[1]=model_slug parts[2]=task_slug
            model_slug="${parts[1]}"
            task_slug="${parts[2]}"
            for f in "$dir"*.json; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              cp "$f" "merged-results/${model_slug}__${task_slug}__${fname}"
            done
          done
          echo "Merged files:"
          ls merged-results/

      - name: Generate HTML report
        run: node generate-report.js merged-results report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/

  # ---------------------------------------------------------------
  # Deploy to GitHub Pages
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: generate-report
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4