name: Setup Hazel Toolchain
description: >
  Installs Node, OCaml 5.2.0 and Hazel's opam dependencies from the pinned
  repository commits, then runs setup-zarith for the native BigInt runtime.

runs:
  using: composite
  steps:
    - name: Install node/npm
      uses: actions/setup-node@v4
      with:
        node-version: "latest"

    - name: Install NPM dependencies
      shell: bash
      run: npm install

    # Must precede setup-ocaml, whose opam-repositories input reads these.
    # See .github/opam-pins.env for why the repositories are pinned.
    - name: Load pinned opam repository commits
      shell: bash
      run: grep -E '^OPAM_REPOSITORY(_ARCHIVE)?_SHA=' .github/opam-pins.env >> "$GITHUB_ENV"

    - name: Set-up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.2.0
        # setup-ocaml's default URL with the pinned commit appended.
        opam-repositories: |
          default: git+https://github.com/ocaml/opam-repository.git#${{ env.OPAM_REPOSITORY_SHA }}
        # Off: setup-ocaml keys this cache on the run id, so it can never be an
        # exact hit, yet uploads ~1.7GB per run. That churn evicts the _opam
        # entry below, which shares a 10GB repository-wide budget. In-run caching
        # is unaffected (DUNE_CACHE / DUNE_CACHE_ROOT).
        dune-cache: false

    # Single-writer: only dev and bot-update-deps save the ~1GB switch, so the
    # ~50 daily branch runs cannot evict the entry they all depend on.
    - name: Retrieve the switch environment if cached
      id: opam-cache-switch
      uses: actions/cache/restore@v4
      with:
        path: "_opam"
        key: ${{ runner.os }}-opam-${{ hashFiles('hazel.opam.locked') }}
        # Warm start when the lockfile changed: opam install is incremental.
        restore-keys: ${{ runner.os }}-opam-

    - name: Add opam repository archive
      shell: bash
      run: |
        eval $(opam env)
        export OPAMYES=1
        opam repo add archive "git+https://github.com/ocaml/opam-repository-archive#${OPAM_REPOSITORY_ARCHIVE_SHA}"

    - name: Install dependencies
      shell: bash
      run: |
        eval $(opam env)
        export OPAMYES=1
        export DUNE_CACHE=enabled
        opam install . --deps-only --with-test --locked

    - name: Clean opam switch
      shell: bash
      run: |
        eval $(opam env)
        export OPAMYES=1
        opam clean --all-switches --download-cache --logs --repo-cache --unused-repositories

    # Explicit rather than actions/cache's post hook, so only a switch that
    # installed cleanly is saved. cache-hit is 'true' only on an exact match, so
    # a restore-keys warm start still saves under the new lockfile hash -- which
    # is what lets a dependency bump populate the cache for everyone else.
    - name: Save the switch environment to cache
      if: >-
        steps.opam-cache-switch.outputs.cache-hit != 'true' &&
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/bot-update-deps')
      uses: actions/cache/save@v4
      with:
        path: "_opam"
        key: ${{ runner.os }}-opam-${{ hashFiles('hazel.opam.locked') }}

    - name: Setup zarith native BigInt runtime
      shell: bash
      run: opam exec -- make setup-zarith
