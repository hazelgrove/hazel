name: Setup Hazel Toolchain
description: >
  Installs Node, OCaml 5.2.0 and Hazel's opam dependencies from the lock file,
  then runs setup-zarith for the native BigInt runtime.

# Two paths. When the cached `_opam` switch was built from this lock file by
# this recipe (almost every run), it is complete: restoring it and loading the
# environment recorded with it is all a job needs, so the fast path skips
# setup-ocaml (whose `opam init` alone took ~40 s), the archive repository
# clone and the no-op `opam install` -- about 70 s per job. Anything else takes
# the slow path, the full install as before, and dev saves the result with its
# environment recorded, so the next run is fast again.
#
# Either way the job ends up with the same environment: the switch's recorded
# variables and `_opam/bin` exported to every later step, so callers run
# `dune`, `make` etc. directly, never `opam exec`. Only the slow path has opam
# itself on PATH; nothing after setup should need it.
runs:
  using: composite
  steps:
    - name: Install node/npm
      uses: actions/setup-node@v4
      with:
        node-version: "latest"

    - name: Install NPM dependencies
      shell: bash
      run: npm install

    # The key covers this file as well as the lock file: a hit skips the whole
    # install recipe below, so a change to the recipe (flags, repositories, the
    # compiler, what gets recorded) must miss and run it. Editing this file
    # therefore costs one slow run on dev.
    - name: Compute the switch cache key
      id: opam-key
      shell: bash
      run: echo "key=${{ runner.os }}-opam-${{ hashFiles('hazel.opam.locked', '.github/actions/setup-hazel-toolchain/action.yml') }}" >> "$GITHUB_OUTPUT"

    # Exact key, no restore-keys: on a miss nothing is restored, and the path is
    # chosen by whether this restore actually succeeded, not by a lookup. A
    # failed download (actions/cache only warns) becomes a slow-path run. On a
    # hit there is nothing more to install: skip to "Export the switch
    # environment".
    - name: Retrieve the cached switch
      id: opam-cache-exact
      uses: actions/cache/restore@v4
      with:
        path: "_opam"
        key: ${{ steps.opam-key.outputs.key }}

    # Slow path. Clear anything a failed or partial restore left behind first:
    # setup-ocaml creates the switch in _opam, and the closest cached switch is
    # restored over it afterwards.
    - name: Clear any partial restore
      if: steps.opam-cache-exact.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf _opam

    - name: Set-up OCaml
      if: steps.opam-cache-exact.outputs.cache-hit != 'true'
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.2.0
        # Keyed on the run id, so never an exact hit, yet it uploads hundreds of
        # MB every run -- the churn that evicts the _opam entry below. In-run
        # caching is unaffected; DUNE_CACHE handles that.
        dune-cache: false

    - name: Retrieve the closest cached switch
      if: steps.opam-cache-exact.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: "_opam"
        key: ${{ steps.opam-key.outputs.key }}
        # Warm start from the newest entry: opam install is incremental.
        restore-keys: ${{ runner.os }}-opam-

    - name: Add opam repository archive
      if: steps.opam-cache-exact.outputs.cache-hit != 'true'
      shell: bash
      run: |
        eval $(opam env)
        export OPAMYES=1
        opam repo add archive git+https://github.com/ocaml/opam-repository-archive

    - name: Install dependencies
      if: steps.opam-cache-exact.outputs.cache-hit != 'true'
      shell: bash
      run: |
        eval $(opam env)
        export OPAMYES=1
        export DUNE_CACHE=enabled
        opam install . --deps-only --with-test --locked

    - name: Clean opam switch
      if: steps.opam-cache-exact.outputs.cache-hit != 'true'
      shell: bash
      run: |
        eval $(opam env)
        export OPAMYES=1
        opam clean --all-switches --download-cache --logs --repo-cache --unused-repositories

    # The variables the fast path needs, read from the switch's real
    # environment rather than parsed out of shell syntax, saved inside the
    # switch as NAME=value lines for $GITHUB_ENV. PATH is handled separately
    # (_opam/bin), and OPAM_LAST_ENV is left out: it points into ~/.opam, which
    # isn't cached.
    - name: Record the switch environment
      if: steps.opam-cache-exact.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        opam exec -- env \
          | grep -E '^(OPAM_SWITCH_PREFIX|CAML_LD_LIBRARY_PATH|OCAML_TOPLEVEL_PATH)=' \
          > _opam/.ci-env
        test "$(wc -l < _opam/.ci-env)" -eq 3 \
          || { echo "::error::expected 3 variables in .ci-env:"; cat _opam/.ci-env; exit 1; }
        cat _opam/.ci-env

    # Only dev and bot-update-deps write, so the daily branch runs cannot evict
    # the entry they all read. Explicit rather than actions/cache's post hook, so
    # only a cleanly installed switch is saved.
    # TEMP (remove before merge): ci/toolchain-fast-path also saves, so its own
    # second run exercises the fast path.
    - name: Save the switch environment to cache
      if: >-
        steps.opam-cache-exact.outputs.cache-hit != 'true' &&
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/bot-update-deps' || github.ref == 'refs/heads/ci/toolchain-fast-path')
      uses: actions/cache/save@v4
      with:
        path: "_opam"
        key: ${{ steps.opam-key.outputs.key }}

    # Both paths: export the switch's recorded environment and its bin/ to
    # every later step in the job, so they run its tools directly.
    - name: Export the switch environment
      shell: bash
      run: |
        set -euo pipefail
        test -f _opam/.ci-env || { echo "::error::_opam has no .ci-env"; exit 1; }
        # The recorded paths are absolute; GitHub's runners use a fixed
        # workspace path, but check rather than assume.
        grep -qx "OPAM_SWITCH_PREFIX=$PWD/_opam" _opam/.ci-env \
          || { echo "::error::the switch was built at a different path than $PWD/_opam"; exit 1; }
        cat _opam/.ci-env >> "$GITHUB_ENV"
        echo "$PWD/_opam/bin" >> "$GITHUB_PATH"

    - name: Setup zarith native BigInt runtime
      shell: bash
      run: make setup-zarith
